<!doctype html>
<html lang="en" class="ui-compact">
<head>
<meta charset="utf-8">
<title data-i18n="popup_title">Lang Weave</title>
<link rel="stylesheet" href="ui.css">
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, sans-serif; color: var(--ui-text); background: var(--ui-bg); }
  h1 { font-size: 16px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row label { display: flex; align-items: center; gap: 6px; }
  section { border-top: 1px solid var(--ui-border); margin-top: 12px; padding-top: 10px; }
  p { margin: 8px 0; }
  .small { color: var(--ui-muted); font-size: 12px; overflow-wrap: anywhere; }
  .error { color: var(--ui-danger); }
  #siteName { display: block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #primary { width: 100%; padding: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  #links { display: flex; justify-content: space-between; margin-top: 12px; }
  #links a { color: inherit; }
  #notice:empty { display: none; }
  button { font: inherit; }
  @media (prefers-color-scheme: dark) {
    input, button { color: var(--ui-control-text); background: var(--ui-control-bg); border: 1px solid var(--ui-control-border); }
  }
</style>
</head>
<body>
  <div class="row"><h1 data-i18n="popup_title">Lang Weave</h1><label for="enabled"><span id="enabledLabel" aria-hidden="true" data-i18n="popup_switch_on">On</span><input type="checkbox" id="enabled" role="switch" aria-label="Lang Weave enabled" data-i18n-aria-label="popup_enabled_label"></label></div>
  <p id="operation" class="small" role="status"></p>
  <section>
    <label class="row" for="siteEnabled"><span id="siteName" data-i18n="popup_this_site">This site</span><input type="checkbox" id="siteEnabled"></label>
    <p id="today" class="small"></p>
    <p id="week" class="small"></p>
    <button id="primary" type="button" data-i18n="popup_practice">Practice</button>
  </section>
  <div id="budgetRecovery" class="small" hidden role="status">
    <p id="budgetWarning"></p>
    <button id="recoverBudget" type="button" data-i18n="popup_budget_reset">Reset today's introduction budget</button>
    <button id="cancelBudget" type="button" data-i18n="popup_budget_keep">Keep paused</button>
  </div>
  <p id="welcomeRoute" hidden><a id="openWelcome" href="welcome.html" data-i18n="popup_welcome_route">Review privacy choices</a></p>
  <nav id="links" aria-label="More" data-i18n-aria-label="popup_more"><a id="openSettings" href="options.html" data-i18n="popup_settings">Settings</a><a id="openWords" href="words.html" data-i18n="popup_my_words">My words</a><a id="openHelp" href="https://github.com/tedks/lang-weave#controls-and-privacy" target="_blank" rel="noopener noreferrer" data-i18n="popup_help">Help</a></nav>
  <div id="notice" class="small error" role="alert"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
