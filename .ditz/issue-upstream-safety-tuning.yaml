id: upstream-safety-tuning
title: Measure and tune conservative title/source exclusions
desc: "Follow-up from PR #8 council nits. The finite local high-stakes list and deterministic
  source checks intentionally prefer leaving text English when uncertain. Review benign
  overlaps such as surname Roth, soup stocks, river-bank wording, capitalized ordinary
  words after names, and nouns before \u201Cof\u201D; measure actual false-positive
  rates on synthetic/consented fixtures before narrowing protection. Also assess leading
  English elisions and unmatched quote boundaries. Do not send titles/site identifiers
  to Gemini or change privacy defaults without a separate accepted ruling. This does
  not block the 0.6.2 safety patch because the known cases fail closed."
type: task
