id: startup-recovery-document-pin
title: Pin retrospective injection to one tab document
desc: 'PR #44 council nit: the startup scan rechecks tab URL/title before insertCSS
  and executeScript, but a same-URL navigation can occur between those API calls.
  Investigate Chrome 140 InjectionTarget.documentIds using the probe''s documentId,
  and avoid leaving an injected stylesheet when the final policy check fails after
  insertCSS. Keep the registered loader''s single-entry behavior and no new permissions.
  Low priority because the new document also receives the registered script and its
  loader guard.'
