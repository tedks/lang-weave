id: cue-offscreen-panel
title: Choose how an open inline cue should behave after its anchor leaves the viewport
desc: 'Council nit on PR #31: the panel remains clamped to the viewport edge when
  its word scrolls away. Consider closing with reliable focus restoration, hiding
  until the anchor returns, or keeping the current panel. Recommendation: prototype
  closing only after deliberate scroll and preserve a clear focus target; keep ticket
  semantics unchanged. Does not block PR #31.'
