id: release-payload-license-files
title: Ship LICENSE-MIT and NOTICE in the fleet payload after the AGPL relicense
desc: 'The relicense (PR relicense-agplv3, 0.11.1) splits licensing into LICENSE (AGPL-3.0-or-later),
  LICENSE-MIT (inherited upstream MIT) and NOTICE. The dotfiles installer scripts/install/install-spanish-weave
  copies only manifest.json, src/*, and LICENSE into the fleet payload, and its docs
  still say "MIT license". At the next pin bump: install LICENSE-MIT and NOTICE too,
  update docs/spanish-weave.md wording, and keep the required-files set honest. Also
  make the Web Store package carry all three files.'
