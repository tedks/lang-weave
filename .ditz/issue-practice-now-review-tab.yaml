id: practice-now-review-tab
title: 'Practice now: reuse or refresh an open review tab instead of staling its ticket'
desc: 'Council nit on PR #28 (Anthropic seat): Practice now opens a new review tab
  each time and replaces the ticket any existing review tab is showing, so that tab''s
  next rating gets the stale reply and reloads. Options: focus an existing review
  tab via chrome.tabs.query on the review URL (needs tabs permission check), or notify
  open review pages through storage.onChanged. Low impact: the stale path is already
  handled.'
