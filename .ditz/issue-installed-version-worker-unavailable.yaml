id: installed-version-worker-unavailable
title: Show the installed version when Settings cannot reach its worker
desc: "Fleet support directs learners to Settings \u2192 About to identify their loaded
  build. Options currently waits for worker status, host permissions and progress
  before displaying chrome.runtime.getManifest().version. Show the loaded manifest
  version even if startup status fails, retaining the diagnostic and normal hydration."
