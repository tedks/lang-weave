id: guess-tab-last-control
title: Keep guess forward-Tab handling aligned with future action layout
desc: "Second convergence council nit on PR #45: the forward-Tab handler queries .fw-guess-actions
  button:last-child. It works for today\u2019s one-button layout, but a future non-button
  element after Dismiss would make the selector return null. If actions change, select
  the last focusable control explicitly and keep the keyboard focus-order gate."
