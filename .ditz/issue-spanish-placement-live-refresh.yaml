  what: commented
  comment: 'Score-hint council follow-up: an explicitly reopened panel currently clears
    status from a prior opening when its fresh read succeeds. If passive refresh is
    added, preserve relevant save announcements and cover a close/reopen while the
    initial read is held. The current queue shares settlement logic and already has
    a mutation-checked delayed-Save regression.'
