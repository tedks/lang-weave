id: highlight-harness-precision
title: Tighten highlight harness evidence for forced colors and layout
desc: 'Nonblocking follow-up from PR #7 council. The real Chromium highlight harness
  checks the computed forced-colors result and the line height in representative light/dark
  fixtures, but it does not mutation-prove that the explicit forced-colors fallback
  is necessary or cover every host line box. The shipped cue and current behavior
  are covered by the existing regression, screenshots and smoke. Consider an explicit
  forced-colors mutation/screenshot and a representative host layout check only if
  this evidence becomes useful for a later styling change. Do not broaden PR #7 for
  this.'
