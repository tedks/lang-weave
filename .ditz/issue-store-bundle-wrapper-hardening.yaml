id: store-bundle-wrapper-hardening
title: Fail closed on additional content bundle module forms
desc: 'Harden the dependency-free Store wrapper beyond the current content closure.
  Council PR #30 nits: exported multi-declarator const only records the first name;
  top-level this and return differ from ESM semantics inside the generated function;
  a module-local __modules declaration could shadow the registry. Current content
  closure uses none of these forms and the Store e2e passes. Either implement explicit
  support or reject each form with a clear PackageError and focused tests. This does
  not block PR #30 because the current graph is within the verified subset.'
