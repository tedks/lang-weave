id: audio-local-voices-ruling
title: Decide whether pronunciation audio via local Web Speech voices is acceptable,
  and the UI shape
desc: 'Source: docs/research/upstream-delta.md (hover-audio speaker), ux-audit #18.
  Upstream speaks the word with speechSynthesis; online voices send the word to the
  voice provider. Options: (A) local voices only, button in the review card and inline
  cue, never on hover, never auto-play; (B) also allow online voices with disclosure;
  (C) no audio. Recommendation: A. Also pick keyboard/click on the word versus a pointer-bridged
  gloss button (upstream needed two review rounds for the pointer version). Decides:
  Ted.'
