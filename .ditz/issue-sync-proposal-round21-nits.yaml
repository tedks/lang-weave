id: sync-proposal-round21-nits
title: 'Sync proposal: round 21 council nits for stage 2/3 design'
desc: 'Source: council round 21 on PR #47 (faf8051..5fb6c38), Opus seat, all Nits,
  not blocking the proposal. Fold into the stage 2/3 design of docs/research/sync-service.md:

  1. 3.7: "Nothing is held." (adopt envelopes never deferred) reads against "held
  pack-version cards"; reword.

  2. 3.7: after eviction the device cannot know held pack cards existed (marker has
  only epoch and device ID); add a flag/count to the marker or state the earlier export
  is the only copy.

  3. 5.1: a device revoked from another device should treat all local state as a kept
  copy (as invariant 3 does for a lost baseline) and discard old IndexedDB state on
  re-pairing.

  4. 3.7: in a pref.set race where both saw the account value absent, the loser should
  be shown its value once, as for a conflict.

  5. 3.7: log rows of an over-cap personal entry should follow its card to the overflow
  store (or be dropped).

  6. 5.1: a stolen device token can revoke every device and force the recovery code;
  consider gating DELETE of another device on a verifier derived from the account
  secret.'
