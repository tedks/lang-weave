id: local-spanish-placement
title: Offer optional offline Spanish vocabulary placement
desc: Offer real bundled vocabulary examples and an explicit starting preference on
  Welcome and Settings for returning Spanish learners. Preserve existing review history,
  settings and non-Spanish packs. No Duolingo account, external scores, model calls
  or permissions for placement. Exercise the actual reader path and unpacked install.
