id: adaptive-selector-prompt-performance
title: Measure adaptive selector prompt serialization cost
desc: Council PR13 nit N-2. selectWorkingSet rebuilds the complete request for each
  candidate. The current catalog is bounded to 226 entries and the request cap is
  25,000 characters, so this is nonblocking. Measure browser latency before optimizing.
  Preserve exact complete-request size accounting, including dispatched passage IDs,
  and deterministic selection.
