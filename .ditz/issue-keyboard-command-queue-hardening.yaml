id: keyboard-command-queue-hardening
title: Review pause command tab snapshot and hung-save queue behavior
desc: 'Fix-delta council nit on PR #31: if Chrome supplies no tab, a queued pause
  command resolves the active tab at execution time, so a tab switch before the queue
  runs can redirect it. A save that never settles also holds subsequent pause commands
  until the worker restarts. Recommendation: snapshot the tab at command receipt and
  add a bounded failure strategy if field evidence shows hung saves; preserve the
  no-new-permissions boundary. Context reads storage directly after each save, so
  the separate stale-cache concern was disproven. Does not block PR #31.'
