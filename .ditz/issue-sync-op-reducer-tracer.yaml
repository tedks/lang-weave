id: sync-op-reducer-tracer
title: Sync op reducer and tracer bullet (stages 0b and 1 of docs/research/sync-service.md)
desc: 'Source: docs/research/sync-service.md sections 3, 7 (0b, 1) and 8, PR #47.
  Not authorized to start until root accepts the proposal; no server deployment, account,
  UI or zip change.


  Scope: pure extension/src/sync-ops.js (op validation reusing exported portability.js
  validators plus guessFirst; generations; supersession records; fold calling an exported
  review.js scheduleCard), sync-crypto.js (AES-GCM, client header as AAD), an in-process
  AGPL server/ with the max_device_seq rule, and extension/test/sync-tracer.test.js.


  Acceptance: equivalence with the current rateReview/finishInline/claimKnown/wordKnown/wordReset
  writes for a single-device session; two-device convergence over any server order
  with duplicates, including both devices rating the same due card Easy inline, duplicate
  push after a lost ack, reset vs stale rating in both orders, tampered header rejected.
  Mutation checks: wall-clock order, removed max_device_seq dedup, removed generation
  check each turn the test red. bun test green; nothing in the Store zip.'
