id: visible-word-highlights
title: Make translated-word highlights visible on light and dark pages
desc: The default translated-word cue is a gray 1px dotted underline that is too subtle,
  especially on dark pages. Strengthen it without changing text color, layout, learning
  behavior, permissions, or network behavior. Preserve practice distinction, hover/context,
  link decoration, keyboard and forced-colors behavior. Verify with a mutation-sensitive
  test, synthetic Chromium light/dark computed and visual evidence, local gates, and
  council review.
