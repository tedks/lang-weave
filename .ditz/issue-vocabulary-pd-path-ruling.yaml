id: vocabulary-pd-path-ruling
title: Rule on the simpler public-domain vocabulary path (self-authored glosses, CC0
  morphology, flagged single-reader review)
desc: 'Source: docs/research/public-domain-vocabulary.md (PR #49). Ted''s challenge:
  avoid the CC BY-SA posture and the double native review.


  Options and recommendation:

  1. Glosses: write English glosses ourselves (as the 226 already are), taking forms/POS/gender
  from Wikidata Lexemes (CC0). Wikidata meanings, Project Gutenberg 1900-1919 school
  vocabularies (US public domain, roughly 80% headword match of the top 3,000, dated
  senses) and Tatoeba alignment serve as uncopied witnesses. Rec: yes; stop planning
  to copy Wiktionary glosses into shipped data. A compilation-level legal read is
  still advisable.

  2. Frequency source: (a) keep the wordfreq coarse bands (BY-SA credit, already shipping),
  (b) Tatoeba-derived bands (CC BY 2.0 FR credit, conversational, needs a name denylist).
  Among the sources tested, no CC0 ranking was adequate to replace wordfreq; the tested
  Common Voice text was unsuitable. Rec: (a) now; (b) only if removing all BY-SA credit
  matters.

  3. Review: drop the 100% double native review of band 1 + the 226 (526 rows) in
  favour of one fluent reader on flagged rows plus the same 60-row sample later bands
  already use. The grounds are cost; no accuracy comparison exists. Add a second reader
  if the sample finds defects the flags missed. On the 226, the Tatoeba alignment
  flag picked out 16 rows: 8 phrase/function-word rows and 8 valid glosses whose anchors
  miss the dominant English word (plane, ship, fun). None was a clear mistranslation.


  Decides: Ted. Blocks: the first band of curriculum-growth. If adopted, it supersedes
  parts of curriculum-data-licence-ruling. Not legal advice; the non-US status of
  the Gutenberg editions is unchecked.


  Root acceptance clarification: measured Wikidata form counts show broad coverage,
  not audited paradigm completeness or correctness. The proposed 60-row rule-of-three
  estimate concerns randomly sampled unflagged rows, assumes reliable defect detection,
  and is not a whole-band guarantee. All three product choices remain proposals for
  Ted.'
