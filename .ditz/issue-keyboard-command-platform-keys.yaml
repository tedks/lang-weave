id: keyboard-command-platform-keys
title: Choose default keyboard shortcuts on macOS and non-US layouts
desc: 'Council nit on PR #31: the suggested Alt+Shift+W/R shortcuts may type special
  characters on macOS or collide with layout switching. Options: keep the suggested
  default, add a mac-specific default, or leave Mac unassigned for user customization.
  Recommendation: test real Chrome on Mac and one non-US layout before choosing; CEO
  decides shortcut product policy. Does not block PR #31, which uses the explicitly
  suggested keys.'
