id: welcome-practice-language
title: Continue the selected Welcome sample language into offline paragraph practice
desc: "On a fresh 0.15.2 install, selecting Paraguayan Guaran\xED in the Welcome sample
  and opening Practice a paragraph starts the exercise in Spanish. Carry an explicitly
  selected bundled language across that link for this exercise. Popup and direct opens
  still use the saved preference. Exercise selection must not persist or grant access."
