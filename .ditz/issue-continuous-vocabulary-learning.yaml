desc: 'Ted2026-10-27 approves programmatic continuous learning and Again/miss, plus
  highlight text -> Add to Lang Weave. Root sequences bounded missions: Again first;
  independently evaluate licensed trustworthy lexical/frequency sources and catalog/working-set/personal-word
