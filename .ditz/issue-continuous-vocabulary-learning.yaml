id: continuous-vocabulary-learning
title: Continuous local vocabulary progression and selection-add
desc: 'Ted2026-10-27 approves programmatic continuous learning and Again/miss, plus
  highlight text -> Add to Lang Weave. Root sequences bounded missions: Again first;
  independently evaluate licensed trustworthy lexical/frequency sources and catalog/working-set/personal-word
  contract; then implement local encounter ranking/replenishment and confirmed selection-add.
  Preserve all existing Spanish/generated scopes/cards/budgets/visible intro/consent/inline
  secrecy and strong delayed gloss. No runtime agents, new money/keys, unconsented
  page-text upload, raw browsing-history storage or broad third-party API calls. Root
  owns integration/normal merges and later fleet release. This is the parent, not
  a blanket code-change lease.'
