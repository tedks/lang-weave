id: store-alarms-dev-observability
title: Make missing unpacked alarm permission observable
desc: 'Council PR #30 nits: optional chrome.alarms guards let the Store worker start
  without the API, but a future unpacked manifest accidentally missing alarms would
  silently lose the self-update timer; the old worker unit test no longer checks onAlarm
  registration. Add a dev-only warning and a focused listener test, or document why
  the existing dev Chromium gate (which checks the alarm) is sufficient. Current Store
  and dev browser gates pass; not a blocker.'
