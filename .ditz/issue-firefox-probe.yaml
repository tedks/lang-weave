id: firefox-probe
title: 'Probe real Firefox: storage.local.setAccessLevel presence and content-loader
  dynamic import'
desc: 'Roadmap M3, no repo change. Source: upstream-delta.md Firefox risks 1 and 3.
  If setAccessLevel is absent the key-isolation guard is silently skipped; then the
  key must be fetched only through the worker. Decides whether firefox-support is
  Adapt or Defer.'
