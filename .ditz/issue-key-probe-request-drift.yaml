id: key-probe-request-drift
title: Keep the key probe aligned with Gemini request configuration
desc: 'The explicit Test key action builds a small generateContent request directly
  while reading uses callGemini. If the endpoint or authentication format changes,
  the paths can drift. Consider a shared minimal request builder that preserves exactly
  one test call without requiring swap-response parsing or adding a fallback. Council
  nit on PR #22.'
