id: key-unsaved-hint
title: Show unsaved key draft in popup
desc: 'The popup now saves a pasted key through Save key or Enter so confirmation
  is explicit. If the popup closes after typing without either action, the draft disappears.
  Add an Unsaved hint while the input differs from stored key state, without displaying
  or logging the key. Council nit on PR #22.'
