id: key-rejection-403-scope
title: Decide whether all Gemini 403 responses mean key rejected
desc: 'PR #22 follows the directed requirement that every HTTP 401/403 maps to key_rejected.
  Some 403 responses may instead mean a model or project is unavailable, where replacing
  the key or suppressing fallback is misleading. Options: (A) retain the simple fixed
  category for all 403s; (B) split allowlisted structured SERVICE_DISABLED/PERMISSION_DENIED
  reasons into separate fixed copy and permit fallback where appropriate. Recommend
  B after synthetic fixtures establish actual provider reason shapes. CEO/product
  owner decides. This does not block PR #22 because the current package explicitly
  requires all 403s.'
