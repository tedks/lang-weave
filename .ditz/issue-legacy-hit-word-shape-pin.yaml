id: legacy-hit-word-shape-pin
title: Pin legacy matcher hit shape
desc: 'PR #46 final convergence nit: the shared legacyInflects predicate falls back
  from `hit.word` to `fr` if a hit has no `word`. `indexFor` constructs a `word` property
  on every runtime hit, so this is not currently reachable or blocking. Add a direct
  runtime-shape invariant test if the index shape is refactored; it should prove the
  matcher still reads the same field as pre-0.12.23. Keep the 226-row compatibility
  oracle.'
