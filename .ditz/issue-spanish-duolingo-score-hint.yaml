id: spanish-duolingo-score-hint
title: Offer an optional local Duolingo Score preview hint for Spanish
desc: Use the published Spanish course Score bands only to order real local placement
  samples. Preserve explicit placement confirmation, keyboard access and revisability.
  Keep the raw Score in the local form with no persistence, network, provider or schema
  additions.
