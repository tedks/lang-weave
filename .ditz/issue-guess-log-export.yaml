id: guess-log-export
title: Enable export of guess and generated-form retrievals once 0.12.22 readers are
  deployed
desc: 'Release-order follow-up for PRs #42 and #45. The current reader validates and
  imports guess-first retrievals and generated-pack forms such as il/elle, z.B., and
  EU:n. The 0.12.22 schema-2 exporter omits guess entries and generated-form retrievals
  that 0.12.21 rejects, counting each omission in logOmitted.retrievals. This follows
  the Lang Weave CTO ruling of 2026-11-02 for polish-2. Once 0.12.22 readers have
  shipped, enable both export paths in a later release, update tests and backup-preview
  copy, and state the minimum reader version in release notes. Until then those retrieval
  measurements do not survive backup and restore.'
