id: guess-log-export
title: Export guess-first retrievals in backups once the tolerant reader has shipped
desc: 'Ruling (team lead, 2026-11-01): option B for PR #42. 0.12.19 reads, stores
  and imports guess-first retrievals (source ''guess''), but schema 2 export leaves
  them out and counts them in logOmitted.retrievals (portability.js EXPORT_GUESSES=false),
  because builds <= 0.12.18 refuse a backup holding one. Once 0.12.19, the tolerant
  reader, has shipped, set EXPORT_GUESSES=true in a later release, update the guess.test.js
  export test and the backup preview ''left out'' copy, and say in that release''s
  notes to install 0.12.19 or later first. Until then guess history and the 3-guess
  cap do not survive backup and restore.'
