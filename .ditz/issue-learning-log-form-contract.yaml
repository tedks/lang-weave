id: learning-log-form-contract
title: Share one word-form contract between cleanPack and the learning-log ID guard
desc: 'Source: PR #19 council round 2 (Anthropic seat nit). learning-log.js validWordId
  refuses some forms cleanPack accepts (il/elle, z.B., 1.000, EU:n), so their retrievals
  and exposures are silently not logged. No learning state is lost, but measurements
  for those words are biased.

  Fix in phase 2: count refused log writes in diagnostics, and either relax the guard
  to the cleanPack form rules or tighten cleanPack so both use one contract (catalog
  membership remains the privacy guarantee).'
