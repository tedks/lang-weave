id: productive-recall-goal-ruling
title: Decide whether productive recall (English to Spanish, typed) is a product goal
  or reading only
desc: 'Source: docs/research/learning-science.md (recommendations 3 and 9). Options:
  (A) reading only: reviews test Spanish->meaning recognition/recall, no typing; (B)
  reading first, production later: receptive retrieval until stable, then optional
  typed English->Spanish; (C) both from the start. Recommendation: B; keep typing
  opt-in. Decides: Ted. Blocks the weight of objective-grading and receptive-productive
  missions, not learning-event-log or fsrs-scheduler.'
