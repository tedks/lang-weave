  comment: '2026-10-18 policy fix-delta council follow-up: three provider seats CLEAN
    on 42b5bc6..a97cf1d. Heavy same-day churn can evict the oldest expired renewal
    ticket from the bounded 20-entry list, leaving that offscreen span English if
