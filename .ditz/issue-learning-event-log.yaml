id: learning-event-log
title: Log every retrieval and exposure locally (word-ID only) and expose an is-it-working
  view
desc: 'Roadmap M1. Source: docs/research/learning-science.md rec 1. Record per retrieval:
  word id, time, source (inline/standalone), direction, outcome, latency, elapsed
  days since last review, scheduled interval, predicted recall; per-word exposure
  aggregates (count, distinct days). Bounded, no URLs or passages, scoped per language/pack
  like events.js. Included in the learning backup format (schema bump). Measurements:
  next-day recall, 21+ day retention, calibration, verified-known count, peek rate,
  exposures per learning word, workload, leeches.'
