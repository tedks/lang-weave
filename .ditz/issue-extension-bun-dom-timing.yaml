id: extension-bun-dom-timing
title: Stabilize timing-sensitive Bun DOM regressions
desc: 'The full extension Bun suite has intermittent DOM failures under resource contention.
  At PR #61 head 984381388626f49cbfd7abac5db5124eed7de11a, Linux-sandbox runs found
  the full 439 cases, with a 15 s gloss.test.js timeout and failed guess-content waits
  in one run, and a 30 s runtime.test.js timeout followed by a text.test.js timer
  assertion in another. A separate demo composition observed a failed fixed-interval
  runtime.test.js assertion and a late content.js flush during update-gate.test.js.
  Early baseline sandbox runs and idle Spanish + gate compositions passed. Related
  onboarding item: bazel-graph-remaining-gates.


  Investigate test fixture timing and teardown. In particular, replace fixed waits
  around initialization and readiness with observable completion where possible, exercise
  timing assertions under controlled clocks, and ensure pending work cannot observe
  a subsequent test''s DOM globals. Preserve test assertions and keep production behavior
  unchanged. Record reproduced failures or the limits of isolation before changing
  timing support.'
type: bugfix
component: default
