  what: commented
  comment: 'Fix-delta council found that same-text gradual rerenders bypass the content
    memo and reach the worker; repeated rerenders create locked worker traffic, and
    a changed policy can create fresh model calls. PR #4 now repaints only the rated
    span after a saved inline rating and isolated Chromium asserts zero additional
    model calls for that action. Measure remaining rerender traffic and optimize without
    reviving stale day/card decisions.'
