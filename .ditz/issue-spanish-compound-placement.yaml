id: spanish-compound-placement
title: Improve Spanish noun-compound placement beyond finite guard
desc: 'Residual model-dependent noun-compound placement after first 79-word Spanish
  curriculum slice. The deterministic source guard covers a finite common list and
  regular plural heads, but unlisted compounds such as "the coffee table" may still
  produce a partial mixed-language swap. Evaluate a bounded parser or wider curated
  guard in a separate mission; add paired positive/negative and mutation tests, measure
  false positives and prompt growth, and preserve existing review/storage behavior.
  No universal compound safety is claimed by PR #9.'
type: bugfix
