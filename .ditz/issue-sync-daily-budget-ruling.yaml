id: sync-daily-budget-ruling
title: Choose whether the daily new-word budget is per device or account
desc: 'PR47 section3.5 proposes per-device introduction accounting; disconnected devices
  may collectively exceed the chosen daily budget. Options: retain independent per-device
  budgets with clear copy; or enforce/account for a shared budget with an explicit
  offline allocation policy. Recommendation: account-level learning intent with conservative
  offline allocations, validated in the reducer prototype; do not imply a strict5/day
  guarantee if several offline devices can each introduce5. Ted decides. Blocks final
  cross-device budgeting behaviour, not a no-UI merge experiment.'
