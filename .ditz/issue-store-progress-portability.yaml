id: store-progress-portability
title: Export and safely import complete supported learning progress for Store migration
desc: First bounded implementation from accepted Chrome Web Store readiness audit
  at0.10.0. Explicit local learning backup covering legacy Spanish, canonical personal
  and generated pack histories/preferences, strict schema/size/identity validation
  and extension-owned preview/confirmed import into a fresh-learning target. Preserve
  source and existing target meaningful progress; no arbitrary merging/deletion, key/cache/quota/ephemeral
  ticket export, site/host permission or network enabling, profile/ID/account changes
  or live Gemini. Root owns acceptance/normal merge/publication; independent of provider/region/publisher
  choices. Early draftPR, round-trip/hostile-input/race/mutation/isolated two-ID MV3
  evidence and exact-head gates/provider council fixpoint. No fleet release lease.
