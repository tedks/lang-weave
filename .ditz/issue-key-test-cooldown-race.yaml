id: key-test-cooldown-race
title: Preserve test-key cooldown after unrelated settings change
desc: 'If Test key receives a 429 or 503 while an unrelated popup setting changes,
  the test result is correctly discarded as stale but its spent call does not persist
  a provider cooldown. A second click can send another request. Persist the cooldown
  when the tested key epoch and model still match, even if the display result is stale.
  Council convergence nit on PR #22; narrow race, outside acceptance gate.'
