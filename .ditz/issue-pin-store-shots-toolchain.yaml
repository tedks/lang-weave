id: pin-store-shots-toolchain
title: Pin the Store screenshot generator toolchain for cross-host byte reproducibility
desc: 'Council nit on store-screenshots PR #37: the README regeneration command uses
  nix shell nixpkgs#bun, whose registry target can change, and rendered font metrics
  can differ across hosts. The current screenshots and script are deterministic under
  the installed Playwright Chromium and fonts; exact PNG bytes are not promised. If
  byte-identical cross-host regeneration becomes a release requirement, pin Bun/Nixpkgs
  and the font environment, then compare generated hashes. This does not block uploading
  the committed images or the current size/format gate.'
