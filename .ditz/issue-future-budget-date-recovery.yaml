id: future-budget-date-recovery
title: Choose recovery for extreme future introduction-budget dates
desc: 'CEO product ruling from upper council: an extreme but calendar-valid future
  introduction-budget date can indefinitely suppress new words under rollback protection.
  Options: warn and offer user-confirmed budget reset when saved day is over seven
  days ahead (recommendation), or automatically repair it. Preserve review history/schedules;
  do not silently treat a genuine clock rollback as fresh quota. Ted decides. Blocks
  final future-date recovery policy, not invalid-calendar parsing or normal rollback
  tests. Async question pending.'
