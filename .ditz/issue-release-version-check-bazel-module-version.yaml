id: release-version-check-bazel-module-version
title: Check the root Lang Weave Bazel module version during release acceptance
desc: "The Guaran\xED demo draft 1294427 had plugin, manifest and package versions
  at 0.13.1 while the root MODULE.bazel still declared lang_weave at 0.12.26. The
  release checker accepted that mismatch. The demo lane owns correcting its release
  values.\n\nFollow-up owner: release-checks lane. Keep this change separate from
  PR #62. Extend the existing checker to include the declared root Lang Weave module
  version when reading the working tree or an explicit committed ref. Preserve historical
  snapshots and synthetic repos with no root module. Report the module path and disagreeing
  version. Add Bazel-run fixtures for mismatched, matched and no-module versions,
  including a pinned ref, and preserve existing classifier behavior. Keep release
  version edits, CI and extension runtime changes outside this checker patch."
type: bugfix
component: default
