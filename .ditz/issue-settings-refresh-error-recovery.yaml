id: settings-refresh-error-recovery
title: Clear a stale Settings status error when the worker recovers
desc: 'Investigate a Settings status error that remains visible after a later storage-triggered
  refresh successfully restores the controls. Preserve actionable errors from user-initiated
  saves; distinguish them from a failed background refresh before clearing the notice.
  #94 establishes the installed manifest must remain visible in both cases. Add a
  disconnected-worker recovery control to the fast suite and actual Options tab.'
type: bugfix
