id: welcome-e2e-ready-helper
title: Fail closed when synthetic browser fixture initialization times out
desc: 'Council PR #29 nit N-10. Nine e2e scripts repeat a loop waiting up to one second
  for initial settings before seeding synthetic keys and consent. The loop currently
  proceeds if settings never appears, making a later failure misleading. Move it to
  a shared harness helper that throws on timeout, or add explicit post-loop assertions,
  while retaining isolated profiles and no live Gemini requests.'
