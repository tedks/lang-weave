id: welcome-model-gate-centralization
title: Audit future Gemini callers against the first-run consent gate
desc: 'Council PR #29 nit N-4. Current model requests are only reading.js swaps, settings-handlers.js
  testKey and addLanguage; each is gated. update.js uses modelCall only to serialize
  reload and fetches a local manifest. Future Gemini callers could miss the separate
  checks. Consider a shared consent guard at the fetch boundary without changing modelCall
  ordering or revision/epoch rechecks. No present bypass was found; this is preventive
  hardening and must preserve existing-profile compatibility.'
