id: personal-capture-stale-ticket-evidence
title: Exercise an owned pending introduction across personal Save revision change
desc: Council PR14 minor test follow-up. The worker regression confirms old-revision
  swaps return stale without a provider call, and an old-revision introAck cannot
  charge learning. Its introAck uses a random ticket, so it does not independently
  demonstrate behavior for an otherwise valid owned pending reservation. Add a fixture
  with a genuine reservation before Save and assert the old ticket is rejected after
  the catalog revision changes, while a normal later request refreshes the page config.
  Production's revision check precedes ticket lookup; this improves evidence rather
  than fixing an observed bug.
