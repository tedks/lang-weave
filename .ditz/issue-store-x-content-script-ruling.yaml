id: store-x-content-script-ruling
title: Decide whether to drop the hard-coded x.com content script and what existing
  unpacked users get
desc: 'Source: docs/research/ux-audit.md #19. The x.com/twitter.com content_scripts
  cause the only install-time host warning and a second consent path. Options: (A)
  remove from the Store manifest only (package script applies the delta), unpacked/fleet
  users keep it; (B) remove everywhere and prompt existing users once to re-enable
  X via the normal site checkbox; (C) keep. Recommendation: A now, B when the welcome
  page can prompt. Decides: Ted. Related: store-site-consent-ruling.'
